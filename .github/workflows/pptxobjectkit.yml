name: PptxObjectKit Build
on:
  push:
    paths: ['src/PptxObjectKit/**', '.github/workflows/pptxobjectkit.yml']
  pull_request:
    paths: ['src/PptxObjectKit/**', '.github/workflows/pptxobjectkit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/PptxObjectKit/PptxObjectKit.Playground.Ui/package-lock.json
      - run: dotnet build src/PptxObjectKit/PptxObjectKit.slnx -c Release
      - run: dotnet run --project src/PptxObjectKit/PptxObjectKit.Tests -c Release --no-build
      - name: Build and test UI
        working-directory: src/PptxObjectKit/PptxObjectKit.Playground.Ui
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pptxobjectkit-test-results
          path: src/PptxObjectKit/PptxObjectKit.Playground.Ui/test-results/
      - name: Build service images
        working-directory: src/PptxObjectKit
        run: docker compose build
